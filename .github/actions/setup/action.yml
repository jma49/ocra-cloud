# Node.js from .nvmrc and node_modules, after the caller's checkout.
# node_modules is restored whole, keyed by the lockfile; only main saves it,
# so every pull request starts from main's.
name: Set up the workspace
description: Node.js from .nvmrc, then node_modules from main's cache or npm ci.
runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
    - if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.restore.outputs.cache-primary-key }}
