name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every check but the tests, each step run even when an earlier one fails,
  # so one run lists every failure.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          save: "true"
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run knip
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck
      - id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build:web && npm run build:node
      # Builds the Worker bundle as a deploy would, without uploading it (no
      # token needed); web/dist is its assets directory.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx wrangler deploy --dry-run --outdir /tmp/bundle

  # The vitest projects (vitest.config.ts) side by side, the Worker's in
  # shards: a private repository's runner has two cores.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker 1/3
            args: --project worker --shard=1/3
          - name: worker 2/3
            args: --project worker --shard=2/3
          - name: worker 3/3
            args: --project worker --shard=3/3
          - name: postgres
            args: --project postgres
          - name: node, web
            args: --project node --project web
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: vitest
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # The matrix value is a list of flags: word splitting is wanted.
          # shellcheck disable=SC2086
          npx vitest run $ARGS

  # Conventional Commits and no AI attribution, with the engine's own checks
  # (AGENTS.md, Working with agents). Pinned by commit, so a push to the
  # engine's main cannot change what runs here; Dependabot bumps the pin.
  commits:
    if: github.event_name == 'pull_request'
    uses: jma49/Open-CR-Agent/.github/workflows/commits.yml@a9c8b91f456ceef4b93806332c293ffb0adf2261 # main after v0.6.0 (job.workflow_sha)

  # CI's time budgets (the engine's docs/ci.md): fails the run when a job
  # set up or ran longer than its ceiling in .github/ci-budgets.json.
  budget:
    needs: [verify, test, commits]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: jma49/Open-CR-Agent/.github/workflows/budget.yml@c07fd436960f9dfa1f2ccc2713525245ec70c4d1 # main after v0.9.0 (job.workflow_sha)
