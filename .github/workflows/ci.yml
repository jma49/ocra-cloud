name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      # Builds the Worker bundle as a deploy would, without uploading it (no token
      # needed). After verify, which builds web/dist (the assets directory).
      - run: npx wrangler deploy --dry-run --outdir /tmp/bundle

  # Conventional Commits and no AI attribution, with the engine's own checks
  # (AGENTS.md, Working with agents).
  commits:
    if: github.event_name == 'pull_request'
    uses: jma49/Open-CR-Agent/.github/workflows/commits.yml@main
